spring.application.name=spazapay-backend
server.port=8080

# TEMPORARY in-memory database (resets every restart). Swap to Postgres later.
spring.datasource.url=jdbc:h2:mem:spazapay
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secret used to sign login tokens. MUST be 32+ characters.
# This default is for local dev only. Before the demo, set a JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-demo-0123456789}
app.jwt.expiry-minutes=60